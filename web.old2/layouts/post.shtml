<extend template="base.shtml">
<head id="head">
	<link type="text/css" rel="stylesheet" href="$site.asset('toc.css').link()">
	<script defer src="$site.asset('toc.js').link()"></script>
	<style>
		#prev-next {
			display: flex;
			flex-direction: row;
			justify-content: space-between;
			margin-top: 40px;
		}

		figure {
			align-self: center;
			text-align: center;
			font-style: italic;
		}

		.post {
			display:flex;
			flex-direction: column;
		}
	</style>

	<ctx :if="$page.footnotes?()">
		<ctx :loop="$if">
			<style :text="$loop.it.ref_ids.at(0).prefix('#').suffix('{anchor-name:--', $loop.it.def_id, '}')"></style>
		</ctx>
	</ctx>

</head>
<body id="body">

	<!-- <div class="post" :html="$page.content()"></div> -->

	<!-- 			← -->

	<!-- 		</a> -->

	<!-- 			<span :text="$if.title"></span> -->
	<!-- 			→ -->
	<!-- 		</a> -->
	<!-- 	</div> -->
	<!-- </div> -->
	<main>
		<h1 :text="$page.title"></h1>
		<nav id="toc" class="toc" aria-label="Table of contents" hidden>
			<details open>
				<summary>Contents</summary>
				<ol></ol>
			</details>
		</nav>
		<div class="post-body" :html="$page.content()"></div>
		<ctx :if="$page.footnotes?()">
			<ol class="sidenotes" :loop="$if">
				<li id="$loop.it.def_id" style="$loop.it.def_id.prefix('position-anchor:--')">
					<ctx :html="$loop.it.html()"></ctx>
					<a class="backref" href="$loop.it.ref_ids.at(0).prefix('#')">↩</a>
				</li>
			</ol>
		</ctx>
	</main>
	<div id="prev-next">
		<div :if="$page.prevPage?()">
			<a href="$if.link()">
				←
				<span :text="$if.title"></span>
			</a>
		</div>
		<div :if="$page.nextPage?()">
			<a href="$if.link()">
				<span :text="$if.title"></span>
				→
			</a>
		</div>
	</div>
</body>
