{% extends "base.html" %}

{% block title %}{{ taxonomy.name }} | {{ config.title }}{% endblock %}

{% block content %}
<h1>{{ taxonomy.name }}</h1>
<ul class="tag-list">
  {% for term in terms %}
  <li>
    <a href="{{ term.permalink }}">#{{ term.name }}</a>
    <span class="tag-count">{{ term.pages | length }} post{{ term.pages | length | pluralize }}</span>
  </li>
  {% endfor %}
</ul>
{% endblock %}
